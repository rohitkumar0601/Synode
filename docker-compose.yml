# Synthetic Data Trust Lab — full local platform (spec §12).
#   docker compose up -d --build --wait     # everything; web UI at http://localhost:3010
# Backing services: postgres, redis, mlflow. Platform: api, web and one Celery worker per
# library env. Python images build from the repo root (incl. third_party/ sources).
# Object storage is NOT a container: MinIO runs natively on the host (README "Start MinIO");
# containers reach it at host.docker.internal:9000 (override: STL_COMPOSE_S3_ENDPOINT_URL).
# Dev-only credentials; host ports avoid 5432/3000/8000, which are taken on the dev machine.
name: stl

x-store-env: &store-env
  # Own variable names (not STL_STORAGE_ROOT / S3_ENDPOINT_URL) so a host .env cannot leak
  # host-only values (outputs/store, 127.0.0.1:9000) into the containers.
  STL_STORAGE_ROOT: ${STL_COMPOSE_STORAGE_ROOT:-s3://stl-artifacts/store}
  S3_ENDPOINT_URL: ${STL_COMPOSE_S3_ENDPOINT_URL:-http://host.docker.internal:9000}
  AWS_ACCESS_KEY_ID: stl
  AWS_SECRET_ACCESS_KEY: stl-dev-secret
  # DB 1: keeps compose queues apart from host-run workers that use the same Redis (DB 0).
  REDIS_URL: redis://redis:6379/1

x-worker-env: &worker-env
  <<: *store-env
  MLFLOW_TRACKING_URI: http://mlflow:5000

x-worker: &worker
  build: &worker-build
    context: .
    dockerfile: docker/worker.Dockerfile
  restart: unless-stopped
  depends_on:
    redis: {condition: service_healthy}
    mlflow: {condition: service_healthy}
  extra_hosts: ["host.docker.internal:host-gateway"]
  healthcheck:
    # STL_WORKER is set in the image; the node name is <worker>@<container hostname>.
    test: ["CMD-SHELL", "celery -A stl_runner.celery_app inspect ping -d \"$$STL_WORKER@$$HOSTNAME\" --timeout 10 >/dev/null"]
    interval: 15s
    timeout: 30s
    retries: 10
    start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stl
      POSTGRES_PASSWORD: stl
      POSTGRES_DB: stl
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stl"]
      interval: 5s
      retries: 10

  # AOF persistence: queued Celery chains survive a Docker/redis restart.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # MLflow: sqlite backend on a volume; artifacts proxied (--serve-artifacts) to the host MinIO,
  # so clients log via mlflow-artifacts:/ and need no S3 credentials for MLflow. One worker:
  # uvicorn's multi-worker supervisor kills slow-starting children under load (restart loop).
  mlflow:
    build: {context: ., dockerfile: docker/mlflow.Dockerfile}
    image: stl-mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination s3://stl-artifacts/mlflow
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${STL_COMPOSE_S3_ENDPOINT_URL:-http://host.docker.internal:9000}
      AWS_ACCESS_KEY_ID: stl
      AWS_SECRET_ACCESS_KEY: stl-dev-secret
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["5000:5000"]
    volumes: [mlflowdata:/mlflow]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      retries: 20
      start_period: 20s

  # API: entrypoint runs `alembic upgrade head`, then uvicorn on :8000 (host 8010).
  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    image: stl-api
    environment:
      <<: *store-env
      DATABASE_URL: postgresql+psycopg://stl:stl@postgres:5432/stl
      STL_CORS_ORIGINS: http://localhost:${STL_WEB_PORT:-3010},http://127.0.0.1:${STL_WEB_PORT:-3010}
      # Optional: STL_STALL_SECONDS (stalled-job threshold, see services/api settings)
    ports: ["${STL_API_PORT:-8010}:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      retries: 20
      start_period: 15s

  # Web: NEXT_PUBLIC_API_URL is baked into the client bundle at build time (browser -> host 8010).
  web:
    build:
      context: apps/web
      dockerfile: ../../docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${STL_PUBLIC_API_URL:-http://localhost:8010}
    image: stl-web
    ports: ["${STL_WEB_PORT:-3010}:3010"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      retries: 20
      start_period: 15s

  # Workers: prefork, concurrency 1 (eval's singling-out counter is not thread-safe).
  worker-sdv:
    <<: *worker
    build:
      <<: *worker-build
      args: {WORKER: sdv, PYTHON: "3.12"}
    image: stl-worker-sdv
    command: celery -A stl_runner.celery_app worker -Q q.sdv --pool=prefork --concurrency=1 -n sdv@%h
    environment:
      <<: *worker-env
      STL_CELERY_INCLUDE: stl_runner.tasks

  worker-synthcity:
    <<: *worker
    build:
      <<: *worker-build
      args: {WORKER: synthcity, PYTHON: "3.11"}
    image: stl-worker-synthcity
    command: celery -A stl_runner.celery_app worker -Q q.synthcity --pool=prefork --concurrency=1 -n synthcity@%h
    environment:
      <<: *worker-env
      STL_CELERY_INCLUDE: stl_runner.tasks,stl_synthcity.tasks

  # stl.metrics has its own queue so metrics never wait behind slow training on q.synthcity.
  # Same image as worker-synthcity (identical build, so the second build is a cache hit).
  worker-metrics:
    <<: *worker
    build:
      <<: *worker-build
      args: {WORKER: synthcity, PYTHON: "3.11"}
    image: stl-worker-synthcity
    command: celery -A stl_runner.celery_app worker -Q q.metrics --pool=prefork --concurrency=1 -n metrics@%h
    environment:
      <<: *worker-env
      STL_WORKER: metrics  # healthcheck node name (the image sets synthcity)
      STL_CELERY_INCLUDE: stl_runner.tasks,stl_synthcity.tasks

  worker-smartnoise:
    <<: *worker
    build:
      <<: *worker-build
      args: {WORKER: smartnoise, PYTHON: "3.12"}
    image: stl-worker-smartnoise
    command: celery -A stl_runner.celery_app worker -Q q.smartnoise --pool=prefork --concurrency=1 -n smartnoise@%h
    environment:
      <<: *worker-env
      STL_CELERY_INCLUDE: stl_runner.tasks

  worker-eval:
    <<: *worker
    build:
      <<: *worker-build
      args: {WORKER: eval, PYTHON: "3.11"}
    image: stl-worker-eval
    command: celery -A stl_runner.celery_app worker -Q q.eval --pool=prefork --concurrency=1 -n eval@%h
    environment:
      <<: *worker-env
      STL_CELERY_INCLUDE: stl_eval.tasks
      # Lowered privacy-attack settings (fast local demo / e2e); unset for full evaluation.
      STL_EVAL_N_ATTACKS: "200"
      STL_EVAL_MIN_ATTACKS: "100"
      STL_EVAL_SINGLING_OUT_MODE: univariate

  worker-meta:
    <<: *worker
    build:
      <<: *worker-build
      args: {WORKER: meta, PYTHON: "3.11"}
    image: stl-worker-meta
    command: celery -A stl_runner.celery_app worker -Q q.meta --pool=prefork --concurrency=1 -n meta@%h
    environment:
      <<: *worker-env
      STL_CELERY_INCLUDE: stl_meta.tasks

volumes:
  pgdata:
  redisdata:
  mlflowdata:
