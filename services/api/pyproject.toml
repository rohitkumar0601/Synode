[project]
name = "stl-api"
version = "0.1.0"
description = "Synthetic Data Trust Lab API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "stl-core",
  "stl-runner[s3]",
  "celery[redis]==5.6.3",
  "fastapi==0.142.*",
  "uvicorn[standard]",
  "sqlmodel==0.0.48",
  "alembic",
  "psycopg[binary]",
  "python-multipart",
  "pyyaml",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx2"]

[tool.uv.sources]
stl-core = { path = "../../packages/core", editable = true }
stl-runner = { path = "../../packages/runner", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (OpenML)"]
