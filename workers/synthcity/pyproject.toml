[project]
name = "stl-synthcity"
version = "0.1.0"
description = "Synthcity worker: marginals, Bayesian network, CTGAN, TVAE, TabDDPM, PrivBayes, GReaT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "stl-core",
  "stl-runner[s3,celery]",
  "synthcity==0.2.12",
  "torch==2.2.2",
  "opacus==1.4.1",
  "pyarrow>=14,<20",
  "be-great==0.0.14",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
stl-core = { path = "../../packages/core", editable = true }
stl-runner = { path = "../../packages/runner", editable = true }
synthcity = { path = "../../third_party/synthcity", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl_synthcity"]

[tool.pytest.ini_options]
markers = ["slow: takes more than a minute", "network: downloads a model"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning", "ignore::sklearn.exceptions.ConvergenceWarning"]
