[project]
name = "stl-eval"
version = "0.1.0"
description = "Evaluation worker: fidelity, utility, privacy metrics"
requires-python = ">=3.11,<3.12"
dependencies = [
  "stl-core",
  "stl-runner[mlflow,s3,celery]",
  "sdmetrics==0.32.0",
  "anonymeter==1.0.0",
  "scikit-learn>=1.3",
  "xgboost>=2",
  "scipy>=1.10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
stl-core = { path = "../../packages/core", editable = true }
stl-runner = { path = "../../packages/runner", editable = true }
sdmetrics = { path = "../../third_party/SDMetrics", editable = true }
anonymeter = { path = "../../third_party/anonymeter", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl_eval"]

[tool.pytest.ini_options]
markers = ["network: needs internet access (OpenML)", "slow: takes more than a minute"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning",
  "ignore:Attack is as good or worse as baseline model:UserWarning:anonymeter",
  "ignore:ks_2samp. Exact calculation unsuccessful:RuntimeWarning"]
