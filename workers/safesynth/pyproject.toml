[project]
name = "stl-safesynth"
version = "0.1.0"
description = "NVIDIA Safe-Synthesizer worker: SmolLM3-3B QLoRA fine-tuning and DP-SGD (A100/GPU)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "stl-core",
  "stl-runner[s3,celery]",
  "nemo-safe-synthesizer",
  "datasets>=2.14",
  "transformers>=4.40",
  "torch",
  "category-encoders",
  "scikit-learn",
]

[tool.uv.sources]
stl-core = { path = "../../packages/core", editable = true }
stl-runner = { path = "../../packages/runner", editable = true }
nemo-safe-synthesizer = { path = "../../third_party/Safe-Synthesizer", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl_safesynth"]
