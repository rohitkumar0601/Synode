[project]
name = "stl-sdv"
version = "0.1.0"
description = "SDV worker: Gaussian Copula"
requires-python = ">=3.12,<3.13"
dependencies = ["stl-core", "stl-runner[s3,celery]", "sdv==1.38.5", "sdmetrics==0.32.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
stl-core = { path = "../../packages/core", editable = true }
stl-runner = { path = "../../packages/runner", editable = true }
sdv = { path = "../../third_party/SDV", editable = true }
sdmetrics = { path = "../../third_party/SDMetrics", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl_sdv"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
