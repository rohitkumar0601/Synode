name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: core
            tests: packages/core/tests
          - env: runner
            tests: packages/runner/tests
          - env: eval
            tests: workers/eval/tests
          - env: eval
            tests: experiments/tests
          - env: sdv
            tests: workers/sdv/tests
          - env: synthcity
            tests: workers/synthcity/tests
            args: -m "not slow and not network"
          - env: smartnoise
            tests: workers/smartnoise/tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: openml-${{ hashFiles('experiments/conf/datasets/*.yaml') }}
      # worker envs install synthcity, SDV, SDMetrics, Anonymeter and smartnoise-synth editable
      # from the pinned upstream clones in third_party/
      - run: bash scripts/fetch_third_party.sh
      - run: bash scripts/envrun.sh ${{ matrix.env }} pytest ${{ matrix.tests }} -q ${{ matrix.args }}
