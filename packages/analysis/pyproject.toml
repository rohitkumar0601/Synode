[project]
name = "stl-analysis"
version = "0.1.0"
description = "Thesis analysis: results table, RQ1 rankings/CD diagrams, RQ2 epsilon curves, cost, report"
requires-python = ">=3.11,<3.12"
dependencies = [
  "stl-core",
  "stl-runner[s3]",
  "pandas>=2.0.3",
  "numpy>=1.24",
  "scipy>=1.10.1",
  "matplotlib>=3.7.2",
  "pyarrow>=14",
  "autorank",
  "tabulate>=0.9.0",
]

[tool.uv.sources]
stl-core = { path = "../core", editable = true }
stl-runner = { path = "../runner", editable = true }
autorank = { path = "../../third_party/autorank", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl_analysis"]
