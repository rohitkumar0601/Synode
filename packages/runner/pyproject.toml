[project]
name = "stl-runner"
version = "0.1.0"
description = "Synthetic Data Trust Lab runtime: storage, datasets, pipeline, tracking"
requires-python = ">=3.10"
dependencies = [
  "stl-core",
  "pyarrow>=14",
  "fsspec>=2024.2",
  "psutil>=5.9",
  "scikit-learn>=1.3",
  "hydra-core>=1.3",
]

[project.optional-dependencies]
s3 = ["s3fs>=2024.2"]
celery = ["celery[redis]==5.6.3"]
mlflow = ["mlflow-skinny>=3", "sqlalchemy>=2", "alembic>=1.13"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "celery[redis]==5.6.3"]

[tool.uv.sources]
stl-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl_runner"]

[tool.pytest.ini_options]
markers = ["network: needs internet access (OpenML)"]
